[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "bioamla"
dynamic = ["version"]
authors = [
  { name="John McMeen", email="johnmcmeen@gmail.com" },
]
description = "Bioacoustics & Machine Learning Applications"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Environment :: Console",
]

dependencies = [
  "tomli>=2.0; python_version < '3.11'",
  "python-dotenv>=1.0",
  "numpy",
  "scipy",
  "pandas",
  "soundfile",
  "pydub",
  "audioop-lts; python_version >= '3.13'",  # pydub needs audioop, removed from the stdlib in 3.13
  "riffy>=0.3.9",
  "requests>=2.28.0",
  "huggingface_hub",
  "pyinaturalist",
  "pyarrow",  # parquet annotations (datasets)
  "pydantic>=2.7",  # validated config objects and their JSON Schema
]

[project.scripts]
bioamla = "bioamla._cli_entry:main"

[project.optional-dependencies]
# The base install covers audio I/O and metadata, file discovery, the batch
# engine, dataset tooling and the catalog clients. Heavier features live in the
# extras below; `bioamla[all]` installs every one of them. Using a feature
# without its extra raises DependencyError naming the extra to install.
audio = [  # signal processing (resample, filter, denoise, ...) and playback
  "librosa",
  "sounddevice>=0.4.0",
]
viz = [  # spectrograms, waveform plots, spectrogram videos
  "bioamla[audio]",
  "matplotlib",
]
indices = [  # acoustic indices
  "bioamla[audio]",
  "numba",
]
detect = [  # event detection
  "bioamla[audio]",
]
ml = [  # AST inference, training and embeddings; augmentation; HF datasets
  "bioamla[audio]",
  "torch",
  "torchvision",
  "torchaudio",
  "transformers[torch]>=5.10.2",  # AST checkpoint key-conversion (old MIT ckpt -> new modular AST)
  "datasets[audio]",
  "audiomentations",
  "evaluate",
  "tensorboard",
  "mlflow>=2.0",
]
cluster = [  # dimensionality reduction, clustering, novelty detection
  "umap-learn>=0.5.0",
  "hdbscan>=0.8.0",
  "scikit-learn>=1.0.0",
]
server = [  # bioamla serve: the HTTP API (calls operations directly; no CLI needed)
  "fastapi>=0.110",
  "uvicorn>=0.29",
]
all = [
  "bioamla[audio,viz,indices,detect,ml,cluster,server]",
]
# The command-line interface. The library itself (`import bioamla`) does not need
# these — only the `bioamla` console command does. Install with
# `pip install bioamla[cli]` to get the CLI.
cli = [
  "click",
  "rich",
]
dev = [
  "bioamla[all,cli]",  # the test suite covers every domain and the CLI
  "pytest>=7.0",
  "pytest-cov",
  "pytest-mock",
  "pytest-asyncio",
  "ruff>=0.17,<0.18",  # pinned: minor releases change formatting; upgrade on purpose
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.26",
  "mkdocs-click>=0.8",
  "pymdown-extensions>=11.0.1,<12",  # 11.0.1 fixes advisories; 12 breaks mkdocstrings highlighting
  "httpx>=0.27",  # FastAPI's TestClient (server tests)
]

[project.urls]
Homepage = "https://github.com/jmcmeen/bioamla"
Documentation = "https://jmcmeen.github.io/bioamla"
Source = "https://github.com/jmcmeen/bioamla"
Changelog = "https://github.com/jmcmeen/bioamla/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/jmcmeen/bioamla/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/bioamla"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build]
include = [
  "src/bioamla/**/*.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
  "--tb=short",
  "--strict-markers",
]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "integration: marks tests as integration tests",
  "requires_cuda: marks tests that require CUDA",
]

[tool.coverage.run]
source = ["src/bioamla"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",      # pycodestyle errors
  "W",      # pycodestyle warnings
  "F",      # Pyflakes
  "I",      # isort
  "B",      # flake8-bugbear
  "C4",     # flake8-comprehensions
  "UP",     # pyupgrade
]
ignore = [
  "E501",   # line too long (handled by formatter)
  "B008",   # do not perform function calls in argument defaults
  "C901",   # too complex
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "E402"]  # allow assert statements; allow imports after pytest.importorskip
# The extra-gated domains check their extra (require_extra) before importing it.
"src/bioamla/{viz,indices,detect,ml,cluster}/__init__.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["bioamla"]
