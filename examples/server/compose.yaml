# A bioamla server with docker compose. From this folder:
#
#   python3 -c "import secrets; print(secrets.token_hex(32))" > bioamla-token
#   docker compose up -d
#   curl http://127.0.0.1:8765/v1/health
#
# Then from a laptop that can reach this host (an SSH tunnel to it; the port is published
# on the host's loopback only unless BIND says otherwise):
#
#   bioamla remote add lab http://localhost:8765
#   export BIOAMLA_LAB_TOKEN=$(cat bioamla-token)
#   bioamla remote ping lab
#
# WORKSPACES and RECORDINGS (environment variables, or a .env file here) choose the host
# folders; the defaults are ./workspaces and ./recordings. Recordings are mounted
# read-only and linked into workspaces in place (bioamla workspace add /recordings/...),
# never copied. BIND is the host address the port is published on: 127.0.0.1 by default,
# or the host's VPN address so laptops on the VPN connect without a tunnel.
services:
  bioamla:
    build:
      context: .
      # args:
      #   BIOAMLA_EXTRAS: all,cli   # every domain, for prediction and training
    image: bioamla-server
    restart: unless-stopped
    # Jobs get a grace period to stop and record their cancellation when the container
    # stops; Docker's default of 10 s could cut that short.
    stop_grace_period: 30s
    ports:
      # Docker Engine 28 keeps a loopback-published port off the LAN; older engines let
      # hosts on the same network segment reach it, so there add a firewall rule.
      - "${BIND:-127.0.0.1}:8765:8765"
    volumes:
      - ${WORKSPACES:-./workspaces}:/workspaces
      - ${RECORDINGS:-./recordings}:/recordings:ro
    secrets:
      - bioamla_token
    # Run as the owner of the token and the mounted folders when that isn't uid 1000:
    # uncomment, then `BIOAMLA_UID=$(id -u) BIOAMLA_GID=$(id -g) docker compose up -d`, or
    # put those two values in .env.
    # user: "${BIOAMLA_UID:-1000}:${BIOAMLA_GID:-1000}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/v1/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
    # For a GPU (with the NVIDIA container toolkit installed), build with BIOAMLA_EXTRAS=all,cli and add:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

secrets:
  bioamla_token:
    file: ./bioamla-token
